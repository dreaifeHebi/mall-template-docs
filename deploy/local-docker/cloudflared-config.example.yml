tunnel: <cloudflare-tunnel-id>
credentials-file: /etc/cloudflared/credentials/<cloudflare-tunnel-id>.json

ingress:
  - hostname: api.example.com
    service: http://api-gateway:80
  - hostname: shop.example.com
    service: http://user-web:80
  - hostname: admin.example.com
    service: http://admin-web:80
  - service: http_status:404
